[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundationmsms"
version = "0.1.0"
description = "Foundation MS/MS utilities and models"
authors = [{name = "FoundationMSMS Team"}]
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "numpy",
    "torch",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "scikit-learn",
    "xgboost",
]

[project.urls]
Homepage = "https://example.com/foundationmsms"

[project.scripts]
lcms-download-voxelize = "foundationmsms.preprocessing.download_and_voxelize:main"
lcms-add-labels = "foundationmsms.preprocessing.add_labels_to_scenario:main"
lcms-build-scenario = "foundationmsms.preprocessing.build_scenario_from_voxel:main"
lcms-optimize-hparams = "foundationmsms.preprocessing.optimize_hparams:main"
lcms-voxelize-provenance = "foundationmsms.preprocessing.voxelize_with_provenance:main"
lcms-build-paper = "foundationmsms.experiments.build_paper:main"
lcms-train-baselines = "foundationmsms.training.train_baselines:main"
