[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundationmsms"
version = "0.1.0"
description = "Foundation MS/MS utilities and models"
authors = [{name = "FoundationMSMS Team"}]
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "numpy",
    "torch",
]

[project.urls]
Homepage = "https://example.com/foundationmsms"
